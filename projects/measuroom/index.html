}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    (() =&gt; {
      const root = document.getElementById(&#x27;measuroom-home&#x27;);
      const feedback = root.querySelector(&#x27;.feedback&#x27;);
      let feedbackTimer;

      const showFeedback = (message) =&gt; {
        window.clearTimeout(feedbackTimer);
        feedback.textContent = message;
        feedback.classList.add(&#x27;is-visible&#x27;);
        feedbackTimer = window.setTimeout(() =&gt; feedback.classList.remove(&#x27;is-visible&#x27;), 1450);
      };

      root.querySelectorAll(&#x27;.tool&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          button.classList.add(&#x27;is-tapped&#x27;);
          window.setTimeout(() =&gt; button.classList.remove(&#x27;is-tapped&#x27;), 160);

          if (button.classList.contains(&#x27;is-locked&#x27;)) {
            button.classList.remove(&#x27;lock-bump&#x27;);
            void button.offsetWidth;
            button.classList.add(&#x27;lock-bump&#x27;);
            showFeedback(`${button.dataset.tool} je uzamčeno`);
            return;
          }

          root.querySelectorAll(&#x27;.tool&#x27;).forEach((item) =&gt; item.classList.remove(&#x27;is-selected&#x27;));
          button.classList.add(&#x27;is-selected&#x27;);
          showFeedback(&#x27;Umístit obraz vybráno&#x27;);
        });
      });

      root.querySelectorAll(&#x27;.round-control&#x27;).forEach((control) =&gt; {
        control.addEventListener(&#x27;click&#x27;, () =&gt; {
          control.classList.add(&#x27;is-tapped&#x27;);
          window.setTimeout(() =&gt; control.classList.remove(&#x27;is-tapped&#x27;), 160);
          showFeedback(control.dataset.action === &#x27;saved&#x27; ? &#x27;Uložená měření&#x27; : &#x27;Nastavení&#x27;);
        });
      });
    })();

&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
